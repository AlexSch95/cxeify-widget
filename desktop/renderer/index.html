<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cxeify Companion Server</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ── Header (Drag Area) ────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 24px 16px;
      -webkit-app-region: drag;
    }

    .header-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .header-icon img {
      width: 100%;
      height: 100%;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
      line-height: 1.3;
    }

    .header-subtitle {
      font-size: 11px;
      color: #555555;
      font-weight: 400;
      line-height: 1.3;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333333;
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    .status-dot.running {
      background: #1DB954;
      box-shadow: 0 0 6px rgba(29, 185, 84, 0.4);
    }

    .status-dot.stopped {
      background: #ff4444;
      box-shadow: 0 0 6px rgba(255, 68, 68, 0.3);
    }

    .status-label {
      font-size: 12px;
      color: #666666;
      font-weight: 400;
    }

    .status-label.running {
      color: #1DB954;
    }

    .status-label.stopped {
      color: #ff4444;
    }

    /* ── Body ──────────────────────────────────────────────────── */
    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 28px 0;
      justify-content: center;
      -webkit-app-region: no-drag;
    }

    /* ── Card ──────────────────────────────────────────────────── */
    .card {
      background: #141414;
      border: 1px solid #1a1a1a;
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-label {
      font-size: 12px;
      color: #666666;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .card-value {
      font-size: 13px;
      color: #cccccc;
      font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
      background: #0a0a0a;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #1a1a1a;
    }

    /* ── Button ─────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      background: transparent;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-app-region: no-drag;
      touch-action: manipulation;
      font-family: inherit;
    }

    .btn:hover {
      background: #ffffff;
      color: #0a0a0a;
      border-color: #ffffff;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: #ffffff;
      color: #0a0a0a;
      border-color: #ffffff;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #e0e0e0;
      border-color: #e0e0e0;
    }

    .btn-secondary {
      border-color: #2a2a2a;
      color: #888888;
      font-size: 12px;
      padding: 8px 16px;
    }

    .btn-secondary:hover {
      border-color: #555555;
      color: #ffffff;
      background: transparent;
    }

    .btn-danger {
      border-color: #2a2a2a;
      color: #666666;
      font-size: 12px;
      padding: 8px 16px;
    }

    .btn-danger:hover {
      border-color: #ff4444;
      color: #ff4444;
      background: transparent;
    }

    /* ── Autostart Checkbox ─────────────────────────────────────── */
    .autostart-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 0;
    }

    .autostart-row input[type="checkbox"] {
      display: none;
    }

    .checkbox-custom {
      width: 18px;
      height: 18px;
      border: 2px solid #333333;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
      flex-shrink: 0;
    }

    .checkbox-custom:hover {
      border-color: #555555;
    }

    input[type="checkbox"]:checked + .checkbox-custom {
      background: #1DB954;
      border-color: #1DB954;
    }

    input[type="checkbox"]:checked + .checkbox-custom::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 6px;
      height: 10px;
      border: solid #0a0a0a;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .autostart-label {
      font-size: 13px;
      color: #888888;
      cursor: pointer;
      transition: color 0.15s;
    }

    .autostart-label:hover {
      color: #ffffff;
    }

    /* ── Footer ─────────────────────────────────────────────────── */
    .footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      padding: 0 28px 24px;
      -webkit-app-region: no-drag;
    }

    /* ── Error ──────────────────────────────────────────────────── */
    .error-msg {
      font-size: 12px;
      color: #ff4444;
      text-align: center;
      padding: 8px 0 0;
    }
  </style>
</head>
<body>
  <!-- Header (Drag Area) -->
  <div class="header">
    <div class="header-icon">
      <img src="../build/icon.ico" alt="Cxeify" />
    </div>
    <div class="header-info">
      <div class="header-title">Cxeify Companion Server</div>
      <div class="header-subtitle">Spotify Controller for iCUE</div>
    </div>
    <div class="header-status">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-label" id="statusLabel">Starting</span>
    </div>
  </div>

  <!-- Body -->
  <div class="body">
    <div class="card">
      <div class="card-row">
        <span class="card-label">Server URL</span>
        <span class="card-value" id="serverUrl">http://127.0.0.1:3000</span>
      </div>

      <button class="btn btn-primary" id="btnOpen">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Open Setup in Browser
      </button>

      <div class="autostart-row">
        <input type="checkbox" id="chkAutostart" />
        <label for="chkAutostart" class="checkbox-custom"></label>
        <label for="chkAutostart" class="autostart-label">Start with Windows</label>
      </div>
    </div>

    <div id="errorMsg" class="error-msg" style="display:none;"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="btn btn-secondary" id="btnHide">Minimize to Tray</button>
    <button class="btn btn-danger" id="btnQuit">Quit</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
