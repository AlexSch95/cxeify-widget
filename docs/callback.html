<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cxeify - Callback</title>
</head>
<body style="background:#121212;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column;gap:16px;">
  <div style="text-align:center;">
    <div class="spinner" style="width:32px;height:32px;border:3px solid rgba(255,255,255,0.08);border-top-color:#1DB954;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;"></div>
    <p id="status">Processing authorization...</p>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const error = params.get('error');
      
      if (error) {
        document.getElementById('status').textContent = '❌ Authorization failed: ' + error;
        // Redirect back to setup page with error
        const setupUrl = window.location.href.replace(/\/callback\.html.*$/, '/index.html');
        window.location.href = setupUrl + '?error=' + encodeURIComponent(error);
        return;
      }
      
      if (!code) {
        document.getElementById('status').textContent = '❌ No authorization code received.';
        return;
      }
      
      // Read verifier and clientId from localStorage
      const verifier = localStorage.getItem('cxeify_code_verifier');
      const clientId = localStorage.getItem('cxeify_client_id');
      
      if (!verifier || !clientId) {
        document.getElementById('status').textContent = '❌ Session expired. Please start over from the setup page.';
        return;
      }
      
      document.getElementById('status').textContent = '⏳ Exchanging code for tokens...';
      
      try {
        const response = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: window.location.href.split('?')[0],
            client_id: clientId,
            code_verifier: verifier,
          }),
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error_description || data.error || 'Token exchange failed');
        }
        
        const refreshToken = data.refresh_token;
        
        if (!refreshToken) {
          throw new Error('No refresh token received. Make sure your Spotify app has the correct Redirect URI.');
        }
        
        // Clean up localStorage
        localStorage.removeItem('cxeify_code_verifier');
        
        // Redirect back to setup page with results
        const setupUrl = window.location.href.replace(/\/callback\.html.*$/, '/index.html');
        window.location.href = setupUrl + '?clientId=' + encodeURIComponent(clientId) + '&refreshToken=' + encodeURIComponent(refreshToken);
      } catch (e) {
        document.getElementById('status').textContent = '❌ Error: ' + e.message;
        // Redirect back to setup page with error
        const setupUrl = window.location.href.replace(/\/callback\.html.*$/, '/index.html');
        setTimeout(() => {
          window.location.href = setupUrl + '?error=' + encodeURIComponent(e.message);
        }, 2000);
      }
    })();
  </script>
</body>
</html>
